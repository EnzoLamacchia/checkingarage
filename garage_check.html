<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Garage Check 🚗🅿️</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c1f26">
<style>
  :root {
    --asphalt-1: #33373f;
    --asphalt-2: #1c1f26;
    --stall-line: rgba(255,255,255,0.5);
    --card-bg: rgba(255,255,255,0.96);
    --card-fg: #1a1a1a;
    --accent: #ff8a3d;
    --accent-2: #3d7bff;
    --muted: #6b7178;
    --border: #e3e6ea;
    --si-bg: #1f9d55;
    --no-bg: #e5484d;
    --smart-bg: #6a4cff;
    --neutral-bg: #64707d;
    --ticket-hole: #23262d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card-bg: rgba(30,32,38,0.96);
      --card-fg: #f0f1f3;
      --border: #3a3e46;
      --muted: #a3a9b0;
    }
  }
  :root[data-theme="dark"] {
    --card-bg: rgba(30,32,38,0.96); --card-fg: #f0f1f3; --border: #3a3e46; --muted: #a3a9b0;
  }
  :root[data-theme="light"] {
    --card-bg: rgba(255,255,255,0.96); --card-fg: #1a1a1a; --border: #e3e6ea; --muted: #6b7178;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--card-fg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0px, transparent 78px,
        var(--stall-line) 78px, var(--stall-line) 82px
      ),
      linear-gradient(160deg, var(--asphalt-1), var(--asphalt-2));
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    z-index: 1;
  }

  .card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 26px 24px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    position: relative;
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    background: var(--ticket-hole);
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
  }
  .card::before { left: -12px; }
  .card::after { right: -12px; }

  .brand-logo {
    position: absolute;
    top: 10px;
    left: 12px;
    height: 54px;
    width: auto;
  }

  .ticket-strip {
    text-align: center;
    border-bottom: 2px dashed var(--border);
    margin: 0 -24px 18px;
    padding: 0 24px 16px;
  }
  .ticket-strip .brand {
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin: 0 0 6px 0;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0;
    text-align: center;
    letter-spacing: -0.02em;
    font-weight: 900;
  }
  h1 .emoji { font-size: 1.3rem; }
  .subtitle {
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
    margin: 6px 0 0 0;
    line-height: 1.4;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 18px 0 6px 0;
  }
  label:first-of-type { margin-top: 0; }

  input[type="date"], select {
    width: 100%;
    font-size: 1.05rem;
    padding: 13px 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--card-bg);
    color: var(--card-fg);
    outline: none;
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="date"]:focus, select:focus {
    border-color: var(--accent-2);
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7178' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 20px;
    padding-right: 40px;
  }

  button.verify {
    width: 100%;
    margin-top: 26px;
    padding: 16px;
    font-size: 1.08rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: #fff;
    background: linear-gradient(135deg, #1f2937, #111827);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(17, 24, 39, 0.4);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button.verify:active {
    transform: translateY(1px) scale(0.99);
    box-shadow: 0 4px 12px rgba(17, 24, 39, 0.35);
  }

  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.74rem;
    margin-top: 18px;
  }

  .day-summary {
    margin: 8px 0 0 0;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--accent-2);
    text-transform: capitalize;
    min-height: 1.2em;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    animation: fadeIn 0.15s ease;
  }
  .overlay.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: 100%;
    max-width: 380px;
    border-radius: 24px;
    padding: 40px 28px 32px;
    text-align: center;
    color: #fff;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    animation: popIn 0.25s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }
  @keyframes popIn {
    from { transform: scale(0.8) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal.si { background: linear-gradient(160deg, #2fbf6b, #1f9d55); }
  .modal.no { background: linear-gradient(160deg, #ff2800, #a30000); }
  .modal.smart { background: linear-gradient(160deg, #8a6bff, #6a4cff); }
  .modal.neutral { background: linear-gradient(160deg, #7c8794, #5a636e); }
  .modal.weekend { background: linear-gradient(160deg, #6ec6e0, #3f96b8); }
  .modal.race { background: linear-gradient(160deg, #ffb020, #ff7a1a); }
  .modal.race .icon { animation: dash 0.6s ease-in-out infinite alternate; }
  @keyframes dash {
    from { transform: translateX(-4px) rotate(-3deg); }
    to { transform: translateX(4px) rotate(3deg); }
  }
  .modal.race .race-bar {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.25);
    margin: 0 0 18px 0;
    overflow: hidden;
    position: relative;
  }
  .modal.race .race-bar::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 60%;
    background: #fff;
    border-radius: 999px;
  }

  .modal .icon {
    font-size: 5rem;
    line-height: 1;
    margin-bottom: 14px;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
    animation: bounce 0.5s ease 0.1s both;
  }
  @keyframes bounce {
    0% { transform: scale(0.4) rotate(-10deg); }
    60% { transform: scale(1.15) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .modal .title {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.01em;
    margin: 0 0 8px 0;
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .modal .modal-date {
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: capitalize;
    opacity: 0.85;
    margin: 0 0 14px 0;
    letter-spacing: 0.02em;
  }
  .modal .detail {
    font-size: 0.95rem;
    opacity: 0.92;
    margin: 0 0 24px 0;
    line-height: 1.4;
    white-space: pre-line;
  }
  .modal .close-btn {
    background: rgba(255,255,255,0.22);
    border: none;
    color: #fff;
    padding: 12px 28px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .modal .close-btn:active { background: rgba(255,255,255,0.32); }

  .modal .day-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 20px;
  }
  .modal .day-chip {
    aspect-ratio: 1 / 1;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    user-select: none;
    background: none;
    padding: 0;
    font-family: inherit;
  }
  .modal .day-chip.si { background: linear-gradient(160deg, #2fbf6b, #1f9d55); }
  .modal .day-chip.no { background: linear-gradient(160deg, #ff2800, #a30000); }
  .modal .day-chip.smart { background: linear-gradient(160deg, #8a6bff, #6a4cff); }
  .modal .day-chip.race { background: linear-gradient(160deg, #ffb020, #ff7a1a); }
  .modal .day-chip.weekend { background: linear-gradient(160deg, #6ec6e0, #3f96b8); }
  .modal .day-chip.neutral { background: linear-gradient(160deg, #7c8794, #5a636e); }

  @media (max-width: 380px) {
    .modal .icon { font-size: 4.2rem; }
    .modal .title { font-size: 1.7rem; }
    .modal .day-strip { gap: 6px; }
  }
</style>
</head>

11": "NO", "2026-09-18": "NO", "2026-09-25": "NO"}}]};

  const DAY_IT = { 1: "LUN", 2: "MAR", 3: "MER", 4: "GIO", 5: "VEN" };
  const DAY_FULL_IT = { 0: "domenica", 1: "lunedì", 2: "martedì", 3: "mercoledì", 4: "giovedì", 5: "venerdì", 6: "sabato" };

  const LAST_PERSON_KEY = "garageCheck.lastPersonId";

  const select = document.getElementById("chiSei");
  DATA.people
    .slice()
    .sort((a, b) => a.nome.localeCompare(b.nome, "it"))
    .forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.nome;
      select.appendChild(opt);
    });

  {
    const lastPersonId = localStorage.getItem(LAST_PERSON_KEY);
    if (lastPersonId && DATA.people.some(p => String(p.id) === lastPersonId)) {
      select.value = lastPersonId;
    }
  }
  select.addEventListener("change", () => {
    if (select.value) localStorage.setItem(LAST_PERSON_KEY, select.value);
  });

  const giornoInput = document.getElementById("giorno");
  const daySummary = document.getElementById("daySummary");
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  const modalIcon = document.getElementById("modalIcon");
  const modalTitle = document.getElementById("modalTitle");
  const modalDate = document.getElementById("modalDate");
  const modalDetail = document.getElementById("modalDetail");
  const raceBar = document.getElementById("raceBar");

  function formatDayLabel(dateStr) {
    if (!dateStr) return "";
    const date = new Date(dateStr + "T00:00:00");
    const dow = date.getDay();
    const dayFull = DAY_FULL_IT[dow] || "sabato/domenica";
    const [y, m, d] = dateStr.split("-");
    return `${dayFull} ${d}/${m}/${y}`;
  }

  function showModal(kind, icon, title, detail, dateStr, person) {
    modal.className = "modal " + kind;
    modalIcon.textContent = icon;
    modalTitle.textContent = title;
    modalDate.textContent = formatDayLabel(dateStr);
    modalDetail.textContent = detail;
    raceBar.style.display = kind === "race" ? "block" : "none";
    overlay.classList.add("open");
  }
  function closeModal() {
    overlay.classList.remove("open");
  }
  document.getElementById("closeBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });

  function updateDaySummary() {
    const dateStr = giornoInput.value;
    daySummary.innerHTML = dateStr ? formatDayLabel(dateStr) : "&nbsp;";
  }
  giornoInput.addEventListener("change", updateDaySummary);
  giornoInput.addEventListener("input", updateDaySummary);

  {
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    if (todayStr >= DATA.start && todayStr <= DATA.end) {
      giornoInput.value = todayStr;
      updateDaySummary();
    }
  }

  function computeOutcome(dateStr, person) {
    const date = new Date(dateStr + "T00:00:00");
    const dow = date.getDay(); // 0=Sun..6=Sat

    if (dow === 0 || dow === 6) {
      const weekendFull = dow === 0 ? "domenica" : "sabato";
      return {
        kind: "weekend", icon: "🌊", title: "VATTINNE A MARE!",
        detail: `Ma l'hai controllato bene il calendario? La data selezionata è ${weekendFull}, altro che garage: rilassati!`
      };
    }

    if (dateStr < DATA.start || dateStr > DATA.end) {
      return {
        kind: "neutral", icon: "🚧", title: "Nessun dato",
        detail: "La data selezionata è fuori dal periodo del piano (04/08–30/09/2026)."
      };
    }

    const dayCode = DAY_IT[dow];
    const dayFull = DAY_FULL_IT[dow];

    if (person.smart.includes(dayCode)) {
      return {
        kind: "smart", icon: "🛌", title: "STATT A CAST!",
        detail: `${person.nome}, ${dayFull} è il tuo giorno di smart working. Resta a casa!`
      };
    }

    const access = person.access[dateStr];
    if (access === "SI") {
      if (dayCode === "VEN") {
        return {
          kind: "race", icon: "🏁", title: "FUSCE!!",
          detail: `${person.nome}, ${dayFull} l'accesso è libero ma i posti sono limitati: chi primo arriva....`
        };
      }
      return {
        kind: "si", icon: "👍", title: "TRASE!",
        detail: `${person.nome}, ${dayFull} hai accesso al garage. Verifica che non ci sia Consiglio e buona giornata!`
      };
    }

    return {
      kind: "no", icon: "🖐️", title: "DAFFÒRE!",
      detail: `${person.nome}, ${dayFull} non è il tuo turno in garage. Riprova un'altra volta!`
    };
  }

  document.getElementById("verifyBtn").addEventListener("click", () => {
    const dateStr = giornoInput.value;
    const personId = select.value;

    if (!dateStr) {
      showModal("neutral", "📅", "Manca la data", "Seleziona prima un giorno da verificare.");
      return;
    }
    if (!personId) {
      showModal("neutral", "🙋", "Manca il nome", "Seleziona chi sei dal menu a tendina.");
      return;
    }

    const person = DATA.people.find(p => String(p.id) === String(personId));
    const outcome = computeOutcome(dateStr, person);
    showModal(outcome.kind, outcome.icon, outcome.title, outcome.detail, dateStr, person);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js");
    });
  }
</script>
